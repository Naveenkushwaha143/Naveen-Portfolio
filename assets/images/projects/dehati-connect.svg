<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a5c2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d3b1e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a7d45;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e5e34;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="250" fill="url(#bg)" rx="12"/>

  <!-- Decorative circles -->
  <circle cx="370" cy="30" r="60" fill="#ffffff08"/>
  <circle cx="30" cy="220" r="50" fill="#ffffff06"/>

  <!-- Title -->
  <text x="200" y="42" font-family="Arial,sans-serif" font-size="22" font-weight="bold"
        fill="#ffffff" text-anchor="middle">🌾 Dehati-Connect</text>
  <text x="200" y="62" font-family="Arial,sans-serif" font-size="11"
        fill="#a8d5b5" text-anchor="middle">SMS-based Skill &amp; Labor Directory</text>

  <!-- SMS bubble — incoming -->
  <rect x="20" y="78" width="190" height="52" rx="10" fill="url(#card)" opacity="0.95"/>
  <text x="32" y="97" font-family="Arial,sans-serif" font-size="10" fill="#c8e6c9">Farmer SMS:</text>
  <text x="32" y="114" font-family="Courier New,monospace" font-size="11" fill="#ffffff"
        font-weight="bold">NEED Tractor Mechanic</text>
  <polygon points="22,130 35,120 35,130" fill="url(#card)" opacity="0.95"/>

  <!-- Arrow -->
  <text x="224" y="111" font-family="Arial,sans-serif" font-size="20" fill="#ffd54f">➜</text>

  <!-- Python / DB box -->
  <rect x="258" y="78" width="122" height="52" rx="10" fill="#1565c0" opacity="0.9"/>
  <text x="319" y="100" font-family="Arial,sans-serif" font-size="10" fill="#bbdefb" text-anchor="middle">🐍 Python Engine</text>
  <text x="319" y="116" font-family="Arial,sans-serif" font-size="9" fill="#90caf9" text-anchor="middle">SQLite Database</text>

  <!-- Down arrow -->
  <text x="310" y="148" font-family="Arial,sans-serif" font-size="18" fill="#ffd54f">↓</text>

  <!-- Reply SMS bubble -->
  <rect x="20" y="150" width="360" height="74" rx="10" fill="#2e7d32" opacity="0.9"/>
  <text x="32" y="169" font-family="Arial,sans-serif" font-size="10" fill="#a5d6a7">Auto-Reply SMS:</text>
  <text x="32" y="184" font-family="Courier New,monospace" font-size="9" fill="#ffffff">1. Ramesh Kumar  📍 Ramnagar  📞 +91-987...</text>
  <text x="32" y="197" font-family="Courier New,monospace" font-size="9" fill="#c8e6c9">2. Suresh Yadav  📍 Ballia    📞 +91-987...</text>
  <text x="32" y="210" font-family="Courier New,monospace" font-size="9" fill="#a5d6a7">3. Dinesh Prasad 📍 Gopalganj 📞 +91-987...</text>

  <!-- Footer tags -->
  <text x="200" y="238" font-family="Arial,sans-serif" font-size="9"
        fill="#69b578" text-anchor="middle">Python · Flask · SQLite · SMS · No Internet Needed</text>
</svg>
